name: Tests de non-régression

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ─── Backend Python (pytest) ──────────────────────────────────────────────
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          # Variables minimales pour les tests (valeurs fictives — les tests mockent les appels réels)
          MONGODB_URI: "mongodb://localhost:27017/keepeat_test"
          JWT_SECRET: "test_secret_ci"
          GEMINI_OCR_API_KEY: "dummy_for_tests"
          GEMINI_RECIPES_API_KEY: "dummy_for_tests"
        run: pytest --tb=short -q

  # ─── Frontend TypeScript (node --test) ────────────────────────────────────
  frontend-tests:
    name: Frontend — TypeScript tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm run test:ci
