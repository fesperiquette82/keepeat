name: Main/Release post-merge checks

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

jobs:
  frontend-main-release-full:
    name: Main/release post-merge / Frontend suite complète
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Full test suite
        run: npm run test:full

      - name: Build web bundle
        run: npm run build

  backend-main-release-full:
    name: Main/release post-merge / Backend suite complète
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Run full pytest non-regression suites
        env:
          MONGODB_URI: "mongodb://localhost:27017/keepeat_test"
          JWT_SECRET: "test_secret_ci"
          GEMINI_OCR_API_KEY: "dummy_for_tests"
          GEMINI_RECIPES_API_KEY: "dummy_for_tests"
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests backend/tests --tb=short -q
