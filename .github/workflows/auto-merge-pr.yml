name: Enable auto-merge on PRs to main

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
      - labeled
  check_suite:
    types:
      - completed
  workflow_run:
    workflows:
      - CI
      - Admin dashboard monitoring tests
      - Mobile E2E (Maestro)
    types:
      - completed
  # BUG-097 : un verdict de relecture posté en commentaire relance le verrou.
  issue_comment:
    types:
      - created

jobs:
  enable-automerge:
    # Un commentaire ne relance le job que s'il vient du propriétaire, sur une
    # PR, et porte un verdict de relecture. Son texte n'est lu que par cette
    # condition : il n'est jamais interpolé dans un script.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, 'codex-fix-review:'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      issues: read
      # BUG-104 : lancer les workflows post-fusion (workflow_dispatch).
      actions: write

    steps:
      - name: Resolve eligible PR context
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          EVENT="${{ github.event_name }}"
          PR_NUMBER=""

          if [ "$EVENT" = "pull_request_target" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [ "$EVENT" = "issue_comment" ]; then
            PR_NUMBER="${{ github.event.issue.number }}"
          elif [ "$EVENT" = "check_suite" ]; then
            HEAD_SHA="${{ github.event.check_suite.head_sha }}"
            PR_NUMBER=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
              --jq 'map(select(.base.ref == "main" and .draft == false))[0].number // empty')
          elif [ "$EVENT" = "workflow_run" ]; then
            PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
              HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
              PR_NUMBER=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
                --jq 'map(select(.base.ref == "main" and .draft == false))[0].number // empty')
            fi
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No eligible PR linked to this event."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          PR_STATE=$(echo "$PR_JSON" | jq -r '.state')
          BASE_REF=$(echo "$PR_JSON" | jq -r '.base.ref')
          IS_DRAFT=$(echo "$PR_JSON" | jq -r '.draft')
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha')
          HEAD_REPO=$(echo "$PR_JSON" | jq -r '.head.repo.full_name')

          # Une PR déjà fusionnée ou fermée n'est plus à fusionner : la fin
          # d'un workflow sur main la retrouve par son commit (BUG-104).
          if [ "$PR_STATE" != "open" ]; then
            echo "Skip: PR is not open (state=$PR_STATE)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BASE_REF" != "main" ]; then
            echo "Skip: PR base is not main (base=$BASE_REF)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$IS_DRAFT" = "true" ]; then
            echo "Skip: PR is draft."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "Skip: untrusted fork PR ($HEAD_REPO)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # BUG-097 : une PR touchée par Codex ne fusionne qu'après relecture de son
      # commit de tête exact (docs/codex-auto-fix.md). Le script vient de main,
      # jamais de la branche de la PR : une PR ne peut pas réécrire son verrou.
      # Même règle pour le script qui lance les workflows post-fusion (BUG-104).
      - name: Checkout the trusted review gate from main (never the PR head)
        if: steps.pr.outputs.should_run == 'true'
        uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: |
            scripts/ci
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Review gate for PRs touched by an automated fixer
        if: steps.pr.outputs.should_run == 'true'
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          python3 scripts/ci/codex_fix_review_gate.py --repo "$REPO" --pr "$PR_NUMBER" --owner "$REPO_OWNER"

      - name: Verify critical checks are completed + success
        if: steps.pr.outputs.should_run == 'true'
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail

          REQUIRED_CHECKS_JSON='[
            "Frontend regression tests",
            "Backend regression tests",
            "Non-regression policy checks",
            "Backend admin dashboard tests",
            "Mobile E2E / Changes detection gate"
          ]'

          CHECK_RUNS=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100")

          echo "Expected critical checks vs actual status:"
          printf "%-55s | %-12s | %-12s | %s\n" "check" "status" "conclusion" "decision"
          printf '%0.s-' {1..110}; echo

          ALL_OK=true

          check_status() {
            local check_name="$1"
            CHECK_INFO=$(echo "$CHECK_RUNS" | jq --arg name "$check_name" '[.check_runs[] | select(.name == $name)] | sort_by(.started_at // "") | last')

            if [ "$CHECK_INFO" = "null" ] || [ -z "$CHECK_INFO" ]; then
              printf "%-55s | %-12s | %-12s | %s\n" "$check_name" "missing" "-" "BLOCK"
              return 1
            fi

            STATUS=$(echo "$CHECK_INFO" | jq -r '.status // "unknown"')
            CONCLUSION=$(echo "$CHECK_INFO" | jq -r '.conclusion // "none"')
            DECISION="BLOCK"

            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
              DECISION="OK"
            else
              printf "%-55s | %-12s | %-12s | %s\n" "$check_name" "$STATUS" "$CONCLUSION" "$DECISION"
              return 1
            fi

            printf "%-55s | %-12s | %-12s | %s\n" "$check_name" "$STATUS" "$CONCLUSION" "$DECISION"
            return 0
          }

          while IFS= read -r CHECK_NAME; do
            if ! check_status "$CHECK_NAME"; then
              ALL_OK=false
            fi
          done < <(echo "$REQUIRED_CHECKS_JSON" | jq -r '.[]')

          # Mobile checks: either explicit "not required" success OR both build+maestro success.
          MOBILE_NOT_REQUIRED_CHECK="Mobile E2E / Not required (changes filter)"
          MOBILE_BUILD_CHECK="Mobile E2E / Build Android debug APK"
          MOBILE_MAESTRO_CHECK="Mobile E2E / PR smoke Maestro suite"

          MOBILE_NOT_REQUIRED_INFO=$(echo "$CHECK_RUNS" | jq --arg name "$MOBILE_NOT_REQUIRED_CHECK" '[.check_runs[] | select(.name == $name)] | sort_by(.started_at // "") | last')
          if [ "$MOBILE_NOT_REQUIRED_INFO" != "null" ] && [ -n "$MOBILE_NOT_REQUIRED_INFO" ]; then
            MNR_STATUS=$(echo "$MOBILE_NOT_REQUIRED_INFO" | jq -r '.status // "unknown"')
            MNR_CONCLUSION=$(echo "$MOBILE_NOT_REQUIRED_INFO" | jq -r '.conclusion // "none"')
            if [ "$MNR_STATUS" = "completed" ] && [ "$MNR_CONCLUSION" = "success" ]; then
              printf "%-55s | %-12s | %-12s | %s\n" "$MOBILE_NOT_REQUIRED_CHECK" "$MNR_STATUS" "$MNR_CONCLUSION" "OK"
            else
              printf "%-55s | %-12s | %-12s | %s\n" "$MOBILE_NOT_REQUIRED_CHECK" "$MNR_STATUS" "$MNR_CONCLUSION" "BLOCK"
              ALL_OK=false
            fi
          else
            if ! check_status "$MOBILE_BUILD_CHECK"; then
              ALL_OK=false
            fi
            if ! check_status "$MOBILE_MAESTRO_CHECK"; then
              ALL_OK=false
            fi
          fi

          if [ "$ALL_OK" != "true" ]; then
            echo "Critical checks gate failed: at least one required check is missing or not completed+success."
            echo "all_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "all_ok=true" >> "$GITHUB_OUTPUT"

      - name: Merge after strict critical checks gate
        id: merge
        if: >-
          steps.pr.outputs.should_run == 'true' &&
          steps.gate.outputs.all_ok == 'true' &&
          steps.review.outputs.review_ok == 'true' &&
          steps.review.outputs.reviewed_head_sha == steps.pr.outputs.head_sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          # BUG-104 : fusion directe, plus d'auto-merge armé (--auto) : une
          # fusion faite plus tard par GitHub ne laisserait aucune étape pour
          # lancer le déploiement et les contrôles post-fusion.
          # sha= : un commit poussé entre la relecture et la fusion fait
          # échouer la fusion au lieu de fusionner avec lui.
          if MERGED=$(gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/merge" \
              -f merge_method=squash -f sha="$HEAD_SHA" --jq '.merged') \
              && [ "$MERGED" = "true" ]; then
            echo "PR #$PR_NUMBER fusionnée."
            echo "merged=true" >> "$GITHUB_OUTPUT"
          elif [ "$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.merged')" = "true" ]; then
            # Deux événements proches (fin de la CI, fin de Maestro) lancent
            # deux exécutions : une seule fusionne, et lance la suite.
            echo "::warning::PR #$PR_NUMBER déjà fusionnée, par une autre exécution qui lance les workflows post-fusion. Si aucune ne l'a fait, les lancer à la main (docs/auto-merge-policy.md)."
          else
            echo "::error::Fusion de la PR #$PR_NUMBER refusée par GitHub."
            exit 1
          fi

      # BUG-104 : une fusion faite avec le GITHUB_TOKEN ne déclenche aucun
      # workflow « push » sur main. Sans cette étape, ni déploiement du
      # back-end, ni contrôles post-fusion, ni APK après une fusion automatique.
      - name: Launch post-merge workflows (deploy, checks, APK)
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          python3 scripts/ci/post_merge_dispatch.py --repo "$REPO" --pr "$PR_NUMBER"

      # Refus par défaut : si une étape ci-dessus a échoué (script absent,
      # panne d'API, commit de tête changé), aucun auto-merge ne reste armé.
      # BUG-105 : y compris quand la résolution de la PR a échoué avant
      # d'écrire ses sorties ; le numéro vient alors de l'événement.
      - name: Disarm auto-merge when a gate step failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number || github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.check_suite.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR identified for this event: nothing to disarm."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$REPO" --disable-auto \
            || echo "No armed auto-merge to disable."
