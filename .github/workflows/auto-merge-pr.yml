name: Enable auto-merge on PRs to main

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  check_suite:
    types:
      - completed

jobs:
  enable-automerge-pr:
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Try to enable auto-merge from pull_request_target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          PR_INFO=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeStateStatus,isDraft)
          echo "$PR_INFO"

          MERGE_STATE=$(echo "$PR_INFO" | jq -r '.mergeStateStatus')
          IS_DRAFT=$(echo "$PR_INFO" | jq -r '.isDraft')

          if [ "$IS_DRAFT" = "true" ]; then
            echo "PR is draft. Skip."
            exit 0
          fi

          case "$MERGE_STATE" in
            CLEAN|HAS_HOOKS|UNSTABLE)
              ;;
            *)
              echo "PR not ready for auto-merge yet. mergeStateStatus=$MERGE_STATE"
              exit 0
              ;;
          esac

          gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash

  enable-automerge-checksuite:
    if: github.event_name == 'check_suite'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Find PR linked to completed check suite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUMBER=$(gh api \
            repos/$REPO/commits/$HEAD_SHA/pulls \
            --jq 'map(select(.base.ref == "main" and .draft == false))[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No eligible PR found for this check suite."
            exit 0
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Check PR state and enable auto-merge
        if: env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          PR_INFO=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeStateStatus,isDraft)
          echo "$PR_INFO"

          MERGE_STATE=$(echo "$PR_INFO" | jq -r '.mergeStateStatus')
          IS_DRAFT=$(echo "$PR_INFO" | jq -r '.isDraft')

          if [ "$IS_DRAFT" = "true" ]; then
            echo "PR is draft. Skip."
            exit 0
          fi

          case "$MERGE_STATE" in
            CLEAN|HAS_HOOKS|UNSTABLE)
              ;;
            *)
              echo "PR not ready for auto-merge yet. mergeStateStatus=$MERGE_STATE"
              exit 0
              ;;
          esac

          gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash