name: CI

on:
  pull_request:
  push:
  merge_group:

jobs:
  frontend-fast:
    name: Frontend lint + tests rapides
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Fast test suite (unit + integration + smoke)
        run: npm run test:ci

      - name: Frontend non-regression suites report
        run: node ../scripts/report-frontend-regression-suites.mjs

  frontend-full:
    name: Frontend suite complète (main/release)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Full test suite
        run: npm run test:full

      - name: Build web bundle
        run: npm run build

  backend-fast:
    name: Backend tests rapides (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Run fast backend suites (policy + regressions + contracts)
        env:
          MONGODB_URI: "mongodb://localhost:27017/keepeat_test"
          JWT_SECRET: "test_secret_ci"
          GEMINI_OCR_API_KEY: "dummy_for_tests"
          GEMINI_RECIPES_API_KEY: "dummy_for_tests"
          PYTHONPATH: ${{ github.workspace }}
        run: >
          python -m pytest
          tests/test_ci_non_regression_policy.py
          tests/test_critical_regressions.py
          tests/test_runtime_server.py
          tests/test_warmup.py
          tests/test_verify_tests_added_policy_script.py
          backend/tests/test_critical_bug_regressions.py
          backend/tests/test_recipe_suggestions_contract.py
          --tb=short -q

  backend-full:
    name: Backend suite complète (main/release)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Run full pytest non-regression suites
        env:
          MONGODB_URI: "mongodb://localhost:27017/keepeat_test"
          JWT_SECRET: "test_secret_ci"
          GEMINI_OCR_API_KEY: "dummy_for_tests"
          GEMINI_RECIPES_API_KEY: "dummy_for_tests"
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests backend/tests --tb=short -q

  test-policy:
    name: Enforce test changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute base ref
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_ref=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
          else
            echo "base_ref=HEAD~1" >> $GITHUB_OUTPUT
          fi

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Verify tests were added or updated
        run: node scripts/verify-tests-added.mjs "${{ steps.vars.outputs.base_ref }}"
