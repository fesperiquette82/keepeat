name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - ai-improvements
  merge_group:

jobs:
  frontend:
    name: Frontend lint + tests
    runs-on: ubuntu-latest
    continue-on-error: true   # informatif uniquement — ne bloque pas le merge

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    continue-on-error: true   # informatif uniquement — ne bloque pas le merge

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest

      - name: Run pytest
        working-directory: backend
        env:
          MONGODB_URI: "mongodb://localhost:27017/keepeat_test"
          JWT_SECRET: "test_secret_ci"
          GEMINI_OCR_API_KEY: "dummy_for_tests"
          GEMINI_RECIPES_API_KEY: "dummy_for_tests"
        run: python -m pytest --tb=short -q

  test-policy:
    name: Enforce test changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute base ref
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_ref=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
          else
            echo "base_ref=HEAD~1" >> $GITHUB_OUTPUT
          fi

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Verify tests were added or updated
        run: node scripts/verify-tests-added.mjs "${{ steps.vars.outputs.base_ref }}"
