name: Codex Auto-fix CI failures

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  autofix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      # Policy marker for non-regression tests:
      # if: ${{ secrets.GEMINI_GLOBAL_PURPOSE_API_KEY != '' }}
      - name: Detect Gemini API key
        id: key_check
        env:
          GEMINI_GLOBAL_PURPOSE_API_KEY: ${{ secrets.GEMINI_GLOBAL_PURPOSE_API_KEY }}
        run: |
          if [ -n "$GEMINI_GLOBAL_PURPOSE_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout failing commit
        if: ${{ steps.key_check.outputs.enabled == 'true' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        if: ${{ steps.key_check.outputs.enabled == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: ${{ steps.key_check.outputs.enabled == 'true' }}
        working-directory: frontend
        run: npm ci

      - name: Install Codex CLI
        if: ${{ steps.key_check.outputs.enabled == 'true' }}
        run: npm install -g @openai/codex

      - name: Run Codex to fix CI
        if: ${{ steps.key_check.outputs.enabled == 'true' }}
        env:
          GEMINI_GLOBAL_PURPOSE_API_KEY: ${{ secrets.GEMINI_GLOBAL_PURPOSE_API_KEY }}
        run: |
          codex exec "
          The CI workflow failed.
          Make the smallest safe fix.
          Follow AGENTS.md.
          If code is changed, add or update regression tests.
          Run frontend lint and tests.
          Stop only when the relevant checks pass.
          "

      - name: Re-run frontend checks
        if: ${{ steps.key_check.outputs.enabled == 'true' }}
        working-directory: frontend
        run: |
          npm run lint
          npm run test:ci

      - name: Create pull request
        if: ${{ steps.key_check.outputs.enabled == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "chore: codex autofix CI failure"
          branch: "codex/autofix-${{ github.event.workflow_run.head_sha }}"
          title: "Codex autofix for failed CI"
          body: |
            Automatic fix proposed after CI failure.
            Includes any required regression test updates.
