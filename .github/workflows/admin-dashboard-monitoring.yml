name: Admin dashboard monitoring tests

on:
  push:
  pull_request:

jobs:
  backend-admin-dashboard-tests:
    name: Backend admin dashboard tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Run admin dashboard regression tests
        env:
          MONGO_URL: "mongodb://localhost:27017/keepeat_test"
          JWT_SECRET_KEY: "test-secret-ci"
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -m pytest -q backend/tests/test_admin_monitoring.py backend/tests/test_admin_monitoring_dashboard_api.py
