name: Mobile E2E (Maestro)

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".maestro/**"
      - ".github/workflows/mobile-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - ".maestro/**"
      - ".github/workflows/mobile-e2e.yml"
  workflow_dispatch:

jobs:
  android-maestro-e2e:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Start backend in test mode
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/keepeat_e2e_test
          DB_NAME: keepeat_e2e_test
          APP_ENV: test
          DISABLE_EXTERNAL_SERVICES: "true"
          MOCK_AI: "true"
          MOCK_OCR: "true"
          MOCK_OPEN_FOOD_FACTS: "true"
          MOCK_BILLING: "true"
          MOCK_EMAILS: "true"
          MOCK_PUSH: "true"
          JWT_SECRET: test-secret
          BACKEND_URL: http://127.0.0.1:8000
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail

          echo "PWD=$(pwd)"
          echo "Waiting for MongoDB test service..."
          python - <<'PY'
          import os
          import time
          from pymongo import MongoClient

          mongo_url = os.environ["MONGO_URL"]
          last_error = None
          for _ in range(60):
              try:
                  client = MongoClient(mongo_url, serverSelectionTimeoutMS=1000)
                  client.admin.command("ping")
                  print("MongoDB ping ok")
                  break
              except Exception as exc:  # pragma: no cover - CI diagnostics
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"MongoDB unavailable after timeout: {last_error}")
          PY

          echo "Verifying Python import path for backend.server..."
          python - <<'PY'
          import backend.server
          print("backend.server import ok")
          PY

          nohup python -m uvicorn backend.server:app --host 0.0.0.0 --port 8000 --log-level debug > backend-e2e.log 2>&1 &
          UVICORN_PID=$!
          echo "uvicorn_pid=$UVICORN_PID"

          HEALTH_OK="false"
          for i in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8000/health >/tmp/health.json; then
              cat /tmp/health.json
              HEALTH_OK="true"
              break
            fi
            sleep 1
          done

          if [ "$HEALTH_OK" != "true" ]; then
            echo "❌ Backend /health check failed"
            if [ -f backend-e2e.log ]; then
              echo "===== backend-e2e.log ====="
              cat backend-e2e.log
              echo "===== end backend-e2e.log ====="
            fi
            if kill -0 "$UVICORN_PID" 2>/dev/null; then
              echo "uvicorn process still running (pid=$UVICORN_PID)"
              ps -fp "$UVICORN_PID" || true
            else
              echo "uvicorn process exited before health check (pid=$UVICORN_PID)"
            fi

            echo "Python import diagnostics:"
            python -c "import importlib; importlib.import_module('backend.server'); print('Import backend.server ok (post-failure)')"
            exit 1
          fi

          curl --fail -X POST http://127.0.0.1:8000/api/test/reset
          curl --fail -X POST http://127.0.0.1:8000/api/test/seed

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prebuild Android app
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: http://10.0.2.2:8000
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Install Maestro CLI
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Run Maestro E2E suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r frontend/android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p maestro-results
            while IFS= read -r flow_file; do
              flow_name="$(basename "$flow_file" .yaml)"
              mode="seeded"
              if [ "$flow_name" = "03-stock-empty-state" ]; then
                mode="empty"
              fi
              echo "==> Preparing state for $flow_name (mode=$mode)"
              node scripts/e2e-reset-seed.mjs --mode="$mode" --base-url=http://10.0.2.2:8000
              ~/.maestro/bin/maestro test "$flow_file" --format junit --output "maestro-results/$flow_name"
            done < <(find .maestro -maxdepth 1 -name '*.yaml' ! -name 'config.yaml' | sort)
            adb logcat -d > emulator-logcat.txt

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts
          path: |
            maestro-results
            backend-e2e.log
            emulator-logcat.txt
            ~/.maestro/tests
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
