name: Mobile E2E (Maestro)

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".maestro/**"
      - "scripts/e2e-*"
      - "scripts/run-maestro-e2e.sh"
      - ".github/workflows/mobile-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - ".maestro/**"
      - "scripts/e2e-*"
      - "scripts/run-maestro-e2e.sh"
      - ".github/workflows/mobile-e2e.yml"
  workflow_dispatch:
    inputs:
      force_mobile_apk_build:
        description: "Force Android debug APK rebuild before running Maestro"
        type: boolean
        required: false
        default: false

jobs:
  changes:
    name: Mobile E2E / Changes detection gate
    runs-on: ubuntu-latest
    outputs:
      mobile_apk_required: ${{ steps.decision.outputs.mobile_apk_required }}
      maestro_required: ${{ steps.decision.outputs.maestro_required }}
      reason: ${{ steps.decision.outputs.reason }}

    steps:
      - name: Detect mobile-impacting changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile_apk_required:
              - 'frontend/**'
              - 'android/**'
              - 'assets/**'
              - 'app.json'
              - 'app.config.*'
              - 'eas.json'
              - 'package.json'
              - 'package-lock.json'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'babel.config.*'
              - 'metro.config.*'
              - 'tsconfig*.json'
            maestro_required:
              - 'frontend/**'
              - 'android/**'
              - 'assets/**'
              - 'app.json'
              - 'app.config.*'
              - 'eas.json'
              - 'package.json'
              - 'package-lock.json'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'babel.config.*'
              - 'metro.config.*'
              - 'tsconfig*.json'
              - '.maestro/**'
              - '.github/workflows/mobile-e2e.yml'
              - 'scripts/e2e-*'
              - 'scripts/run-maestro-e2e.sh'

      - name: Decide whether APK build / Maestro are required
        id: decision
        run: |
          set -euo pipefail

          APK_REQUIRED="${{ steps.filter.outputs.mobile_apk_required }}"
          MAESTRO_REQUIRED="${{ steps.filter.outputs.maestro_required }}"
          FORCE_BUILD="${{ github.event_name == 'workflow_dispatch' && inputs.force_mobile_apk_build || false }}"
          REASON=""

          if [ "$FORCE_BUILD" = "true" ]; then
            APK_REQUIRED="true"
            MAESTRO_REQUIRED="true"
            REASON="workflow_dispatch_force_mobile_apk_build"
          elif [ "$MAESTRO_REQUIRED" != "true" ]; then
            REASON="only_non_mobile_changes_detected"
          elif [ "$APK_REQUIRED" = "true" ]; then
            REASON="apk_and_maestro_impacted_files_detected"
          else
            REASON="maestro_runner_or_flow_change_without_apk_delta"
          fi

          echo "mobile_apk_required=$APK_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "maestro_required=$MAESTRO_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          echo "Mobile E2E decision: mobile_apk_required=$APK_REQUIRED maestro_required=$MAESTRO_REQUIRED reason=$REASON force_mobile_apk_build=$FORCE_BUILD"

  build-android-debug-apk:
    name: Mobile E2E / Build Android debug APK
    needs: changes
    if: needs.changes.outputs.maestro_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      apk_ready: ${{ steps.apk_decision.outputs.apk_ready }}
      apk_source: ${{ steps.apk_decision.outputs.apk_source }}
      source_run_id: ${{ steps.apk_decision.outputs.source_run_id }}
      source_head_sha: ${{ steps.apk_decision.outputs.source_head_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Log APK strategy inputs
        run: |
          TRY_REUSE_APK="false"
          if [ "${{ needs.changes.outputs.maestro_required }}" = "true" ] && [ "${{ needs.changes.outputs.mobile_apk_required }}" = "false" ]; then
            TRY_REUSE_APK="true"
          fi
          BUILD_APK_STEP_SHOULD_RUN="false"
          if [ "${{ needs.changes.outputs.mobile_apk_required }}" = "true" ]; then
            BUILD_APK_STEP_SHOULD_RUN="true"
          fi
          echo "mobile_apk_required=${{ needs.changes.outputs.mobile_apk_required }}"
          echo "maestro_required=${{ needs.changes.outputs.maestro_required }}"
          echo "force_mobile_apk_build=${{ github.event_name == 'workflow_dispatch' && inputs.force_mobile_apk_build || false }}"
          echo "try_reuse_apk=$TRY_REUSE_APK"
          echo "build_apk_step_should_run=$BUILD_APK_STEP_SHOULD_RUN"

      - name: Try reusing existing PR APK artifact
        if: needs.changes.outputs.mobile_apk_required == 'false'
        id: reuse_apk
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          mkdir -p e2e-apk
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "source_run_id=" >> "$GITHUB_OUTPUT"
          echo "source_head_sha=" >> "$GITHUB_OUTPUT"
          echo "reuse_apk_success=false"

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Skip reusable APK lookup: event=${{ github.event_name }} (requires pull_request)."
            exit 0
          fi

          echo "Looking for reusable android-debug-apk artifact for PR #$PR_NUMBER"
          echo "current_head_sha=$CURRENT_HEAD_SHA"

          CANDIDATE_RUNS_JSON="$(gh api "repos/$REPO/actions/runs?event=pull_request&per_page=100" \
            --jq '.workflow_runs
              | map(select(.name == "Mobile E2E (Maestro)"))
              | map(select(.id != ('"$CURRENT_RUN_ID"'|tonumber)))
              | map(select(any(.pull_requests[]?; .number == ('"$PR_NUMBER"'|tonumber))))
              | map({id: .id, head_sha: .head_sha})')"

          if [ "$CANDIDATE_RUNS_JSON" = "[]" ]; then
            echo "No reusable run found for PR #$PR_NUMBER."
            exit 0
          fi

          for RUN_ID in $(echo "$CANDIDATE_RUNS_JSON" | jq -r '.[].id'); do
            RUN_HEAD_SHA="$(echo "$CANDIDATE_RUNS_JSON" | jq -r '.[] | select(.id == ('"$RUN_ID"'|tonumber)) | .head_sha')"
            [ -z "$RUN_HEAD_SHA" ] && continue

            BUILD_JOB_OK="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '.jobs | map(select(.name == "Mobile E2E / Build Android debug APK" and .conclusion == "success")) | length')"
            if [ "$BUILD_JOB_OK" = "0" ]; then
              echo "Skip run_id=$RUN_ID: build job was not successful."
              continue
            fi

            ARTIFACT_ID="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts
                | map(select(.name == "android-debug-apk" and .expired == false))
                | .[0].id // empty')"
            if [ -z "$ARTIFACT_ID" ]; then
              echo "Skip run_id=$RUN_ID: no valid android-debug-apk artifact."
              continue
            fi

            SAME_SHA="false"
            if [ "$RUN_HEAD_SHA" = "$CURRENT_HEAD_SHA" ]; then
              SAME_SHA="true"
            fi

            echo "artifact_source_run_id=$RUN_ID"
            echo "artifact_source_head_sha=$RUN_HEAD_SHA"
            echo "source_head_sha_equals_current=$SAME_SHA"

            APK_RELEVANT_CHANGED="unknown"
            if [ "$SAME_SHA" = "true" ]; then
              APK_RELEVANT_CHANGED="false"
            else
              if git cat-file -e "${RUN_HEAD_SHA}^{commit}" 2>/dev/null; then
                CHANGED_APK_FILES="$(git diff --name-only "$RUN_HEAD_SHA" "$CURRENT_HEAD_SHA" -- \
                  frontend/** \
                  android/** \
                  assets/** \
                  app.json \
                  app.config.* \
                  eas.json \
                  package.json \
                  package-lock.json \
                  babel.config.* \
                  metro.config.* \
                  tsconfig*.json)"
                if [ -n "$CHANGED_APK_FILES" ]; then
                  APK_RELEVANT_CHANGED="true"
                else
                  APK_RELEVANT_CHANGED="false"
                fi
              else
                echo "Cannot verify diff: source SHA $RUN_HEAD_SHA is unavailable locally."
              fi
            fi

            echo "apk_relevant_files_changed_since_source=$APK_RELEVANT_CHANGED"
            if [ "$APK_RELEVANT_CHANGED" != "false" ]; then
              echo "Skip run_id=$RUN_ID: cannot prove APK compatibility."
              continue
            fi

            gh run download "$RUN_ID" --name android-debug-apk --dir e2e-apk
            if [ ! -f e2e-apk/app-debug.apk ]; then
              echo "Downloaded artifact is invalid: missing e2e-apk/app-debug.apk"
              rm -rf e2e-apk
              mkdir -p e2e-apk
              continue
            fi

            echo "✅ Reusing APK: e2e-apk/app-debug.apk (run_id=$RUN_ID source_head_sha=$RUN_HEAD_SHA)"
            echo "reuse_apk_success=true"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "source_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "source_head_sha=$RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          done

          echo "No valid reusable APK found after evaluating PR artifacts."

      - name: Decide whether to build APK
        id: decide_build
        run: |
          set -euo pipefail

          BUILD_APK_STEP_SHOULD_RUN="false"
          REUSE_APK_SUCCESS="${{ steps.reuse_apk.outputs.found || 'false' }}"

          if [ "${{ needs.changes.outputs.mobile_apk_required }}" = "true" ]; then
            BUILD_APK_STEP_SHOULD_RUN="true"
          elif [ "${{ needs.changes.outputs.maestro_required }}" = "true" ] && [ "$REUSE_APK_SUCCESS" = "false" ]; then
            echo "ℹ️  Maestro required but no reusable APK found — will build APK automatically"
            BUILD_APK_STEP_SHOULD_RUN="true"
          fi

          echo "build_apk_step_should_run=$BUILD_APK_STEP_SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "APK build decision: build_apk_step_should_run=$BUILD_APK_STEP_SHOULD_RUN (mobile_apk_required=${{ needs.changes.outputs.mobile_apk_required }} maestro_required=${{ needs.changes.outputs.maestro_required }} reuse_apk_success=$REUSE_APK_SUCCESS)"

      - name: Setup Node
        if: steps.decide_build.outputs.build_apk_step_should_run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.decide_build.outputs.build_apk_step_should_run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Setup Java
        if: steps.decide_build.outputs.build_apk_step_should_run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prebuild Android app
        if: steps.decide_build.outputs.build_apk_step_should_run == 'true'
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: http://10.0.2.2:8000
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        if: steps.decide_build.outputs.build_apk_step_should_run == 'true'
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/e2e-apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/e2e-apk/app-debug.apk"

      - name: Decide APK availability
        id: apk_decision
        run: |
          set -euo pipefail

          APK_READY="false"
          APK_SOURCE="none"
          SOURCE_RUN_ID=""
          SOURCE_HEAD_SHA=""

          # Check if APK was built in current run
          if [ "${{ steps.decide_build.outputs.build_apk_step_should_run }}" = "true" ] && [ -f e2e-apk/app-debug.apk ]; then
            APK_READY="true"
            APK_SOURCE="built"
            SOURCE_RUN_ID="${{ github.run_id }}"
            SOURCE_HEAD_SHA="${{ github.sha }}"
          # Check if APK was reused from a previous run
          elif [ "${{ steps.reuse_apk.outputs.found || 'false' }}" = "true" ] && [ -f e2e-apk/app-debug.apk ]; then
            APK_READY="true"
            APK_SOURCE="reused"
            SOURCE_RUN_ID="${{ steps.reuse_apk.outputs.source_run_id }}"
            SOURCE_HEAD_SHA="${{ steps.reuse_apk.outputs.source_head_sha }}"
          fi

          echo "apk_ready=$APK_READY" >> "$GITHUB_OUTPUT"
          echo "apk_source=$APK_SOURCE" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_head_sha=$SOURCE_HEAD_SHA" >> "$GITHUB_OUTPUT"

          # Compute diagnostic flags for logging
          TRY_REUSE_APK="false"
          if [ "${{ needs.changes.outputs.mobile_apk_required }}" = "false" ] && [ "${{ needs.changes.outputs.maestro_required }}" = "true" ]; then
            TRY_REUSE_APK="true"
          fi
          REUSE_APK_SUCCESS="false"
          if [ "$APK_SOURCE" = "reused" ]; then
            REUSE_APK_SUCCESS="true"
          fi

          echo "try_reuse_apk=$TRY_REUSE_APK"
          echo "reuse_apk_success=$REUSE_APK_SUCCESS"
          echo "build_apk_step_should_run=${{ steps.decide_build.outputs.build_apk_step_should_run }}"
          echo "APK final decision: mobile_apk_required=${{ needs.changes.outputs.mobile_apk_required }} maestro_required=${{ needs.changes.outputs.maestro_required }} apk_ready=$APK_READY apk_source=$APK_SOURCE source_run_id=$SOURCE_RUN_ID source_head_sha=$SOURCE_HEAD_SHA"
          echo "try_reuse_apk=$TRY_REUSE_APK reuse_apk_success=$REUSE_APK_SUCCESS build_apk_step_should_run=${{ steps.decide_build.outputs.build_apk_step_should_run }}"

      - name: Upload Android debug APK artifact
        if: steps.apk_decision.outputs.apk_source == 'built'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: e2e-apk/app-debug.apk

  maestro-e2e:
    name: Mobile E2E / PR smoke Maestro suite
    needs:
      - changes
      - build-android-debug-apk
    if: needs.changes.outputs.maestro_required == 'true' && needs.build-android-debug-apk.outputs.apk_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Start backend in test mode
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/keepeat_e2e_test
          DB_NAME: keepeat_e2e_test
          APP_ENV: test
          DISABLE_EXTERNAL_SERVICES: "true"
          MOCK_AI: "true"
          MOCK_OCR: "true"
          MOCK_OPEN_FOOD_FACTS: "true"
          MOCK_BILLING: "true"
          MOCK_EMAILS: "true"
          MOCK_PUSH: "true"
          JWT_SECRET: test-secret
          BACKEND_URL: http://127.0.0.1:8000
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail

          echo "PWD=$(pwd)"
          echo "Waiting for MongoDB test service..."
          python - <<'PY'
          import os
          import time
          from pymongo import MongoClient

          mongo_url = os.environ["MONGO_URL"]
          last_error = None
          for _ in range(60):
              try:
                  client = MongoClient(mongo_url, serverSelectionTimeoutMS=1000)
                  client.admin.command("ping")
                  print("MongoDB ping ok")
                  break
              except Exception as exc:  # pragma: no cover - CI diagnostics
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"MongoDB unavailable after timeout: {last_error}")
          PY

          echo "Verifying Python import path for backend.server..."
          python - <<'PY'
          import backend.server
          print("backend.server import ok")
          PY

          nohup python -m uvicorn backend.server:app --host 0.0.0.0 --port 8000 --log-level debug > backend-e2e.log 2>&1 &
          UVICORN_PID=$!
          echo "uvicorn_pid=$UVICORN_PID"

          HEALTH_OK="false"
          for i in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8000/health >/tmp/health.json; then
              cat /tmp/health.json
              HEALTH_OK="true"
              break
            fi
            sleep 1
          done

          if [ "$HEALTH_OK" != "true" ]; then
            echo "❌ Backend /health check failed"
            if [ -f backend-e2e.log ]; then
              echo "===== backend-e2e.log ====="
              cat backend-e2e.log
              echo "===== end backend-e2e.log ====="
            fi
            if kill -0 "$UVICORN_PID" 2>/dev/null; then
              echo "uvicorn process still running (pid=$UVICORN_PID)"
              ps -fp "$UVICORN_PID" || true
            else
              echo "uvicorn process exited before health check (pid=$UVICORN_PID)"
            fi

            echo "Python import diagnostics:"
            python -c "import importlib; importlib.import_module('backend.server'); print('Import backend.server ok (post-failure)')"
            exit 1
          fi

          curl --fail -X POST http://127.0.0.1:8000/api/test/reset
          curl --fail -X POST http://127.0.0.1:8000/api/test/seed

      - name: Download Android debug APK artifact (built in current run)
        if: needs.build-android-debug-apk.outputs.apk_source == 'built'
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: e2e-apk

      - name: Download reusable Android debug APK artifact (source run)
        if: needs.build-android-debug-apk.outputs.apk_source == 'reused'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.build-android-debug-apk.outputs.source_run_id }}
          SOURCE_HEAD_SHA: ${{ needs.build-android-debug-apk.outputs.source_head_sha }}
          CURRENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p e2e-apk
          echo "artifact_source_run_id=$SOURCE_RUN_ID"
          echo "artifact_source_head_sha=$SOURCE_HEAD_SHA"
          echo "current_head_sha=$CURRENT_HEAD_SHA"
          gh run download "$SOURCE_RUN_ID" --name android-debug-apk --dir e2e-apk

      - name: Fail if APK artifact is missing
        run: |
          if [ ! -f e2e-apk/app-debug.apk ]; then
            echo "❌ Missing required artifact: e2e-apk/app-debug.apk"
            exit 1
          fi

      - name: Setup Node (for E2E reset/seed helper)
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify host-side backend health before Maestro
        env:
          E2E_RESET_SEED_BASE_URL: http://127.0.0.1:8000
        run: |
          if ! curl --fail "$E2E_RESET_SEED_BASE_URL/health"; then
            echo "❌ Backend unreachable from runner at $E2E_RESET_SEED_BASE_URL"
            if [ -f backend-e2e.log ]; then
              echo "===== backend-e2e.log ====="
              cat backend-e2e.log
              echo "===== end backend-e2e.log ====="
            fi
            exit 1
          fi

      - name: Install Maestro CLI
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Run Maestro E2E suite
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_RESET_SEED_BASE_URL: http://127.0.0.1:8000
          MAESTRO_SUITE: smoke
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
        with:
          api-level: 34
          arch: x86_64
          disable-linux-hw-accel: false
          emulator-options: -accel auto -gpu swiftshader_indirect -no-window -no-audio -no-snapshot
          script: |
            bash scripts/run-maestro-e2e.sh --suite "$MAESTRO_SUITE"

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts
          path: |
            e2e-apk/app-debug.apk
            maestro-results
            backend-e2e.log
            emulator-logcat.txt
            ~/.maestro/tests

  mobile-e2e-not-required:
    name: Mobile E2E / Not required or missing required APK
    needs:
      - changes
      - build-android-debug-apk
    if: needs.changes.outputs.maestro_required == 'false' || needs.build-android-debug-apk.outputs.apk_ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain gate decision
        run: |
          mkdir -p ci-diagnostics
          {
          echo "Mobile E2E skipped by changes filter or reusable APK policy."
          echo "mobile_apk_required=${{ needs.changes.outputs.mobile_apk_required }}"
          echo "maestro_required=${{ needs.changes.outputs.maestro_required }}"
          echo "force_mobile_apk_build=${{ github.event_name == 'workflow_dispatch' && inputs.force_mobile_apk_build || false }}"
          if [ "${{ needs.changes.outputs.mobile_apk_required }}" = "false" ] && [ "${{ needs.changes.outputs.maestro_required }}" = "true" ]; then
            echo "try_reuse_apk=true"
          else
            echo "try_reuse_apk=false"
          fi
          if [ "${{ needs.build-android-debug-apk.outputs.apk_source }}" = "reused" ]; then
            echo "reuse_apk_success=true"
          else
            echo "reuse_apk_success=false"
          fi
          echo "reason=${{ needs.changes.outputs.reason }}"
          echo "apk_ready=${{ needs.build-android-debug-apk.outputs.apk_ready }}"
          echo "apk_source=${{ needs.build-android-debug-apk.outputs.apk_source }}"
          if [ "${{ needs.changes.outputs.mobile_apk_required }}" = "true" ]; then
            echo "build_apk_step_should_run=true"
          else
            echo "build_apk_step_should_run=false"
          fi
          echo "source_run_id=${{ needs.build-android-debug-apk.outputs.source_run_id }}"
          echo "source_head_sha=${{ needs.build-android-debug-apk.outputs.source_head_sha }}"
          } | tee ci-diagnostics/mobile-e2e-gate.txt

      - name: Fail when Maestro is required but no compatible APK is available
        if: needs.changes.outputs.maestro_required == 'true' && needs.build-android-debug-apk.outputs.apk_ready != 'true'
        run: |
          echo "Maestro is required but no compatible APK artifact was found. Re-run with workflow_dispatch force_mobile_apk_build=true or provide a compatible APK artifact."
          exit 1

      - name: Upload Mobile E2E gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-gate-diagnostics
          path: ci-diagnostics/mobile-e2e-gate.txt

      - name: Explain skip reason when Maestro is not required
        if: needs.changes.outputs.maestro_required == 'false'
        run: |
          echo "Mobile E2E skipped: Maestro is not required for this change set."
