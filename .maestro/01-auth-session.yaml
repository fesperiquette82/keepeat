appId: com.fesperiquette.keepeat
---
- launchApp
- waitForAnimationToEnd
- takeScreenshot: 01-auth-session-initial-state

- runFlow:
    when:
      visible:
        id: tab-home
    commands:
      - assertVisible:
          id: tab-home

- runFlow:
    when:
      visible:
        id: login-email-input
    commands:
      - tapOn:
          id: login-email-input
      - inputText: e2e.free@keepeat.test
      - tapOn:
          id: login-password-input
      - inputText: TestPassword123!
      - hideKeyboard
      - waitForAnimationToEnd
      - tapOn:
          id: login-submit-button
      - waitForAnimationToEnd
      - takeScreenshot: 01-auth-session-after-submit
      - extendedWaitUntil:
          visible:
            id: tab-home
          timeout: 30000

- runFlow:
    when:
      visible:
        id: login-email-input
    commands:
      - takeScreenshot: 01-auth-session-login-still-visible-after-submit
      - assertNotVisible:
          id: login-email-input

- runFlow:
    when:
      notVisible:
        id: tab-home
    commands:
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              id: login-email-input
          commands:
            - tapOn:
                id: login-email-input
            - inputText: e2e.free@keepeat.test
            - tapOn:
                id: login-password-input
            - inputText: TestPassword123!
            - hideKeyboard
            - waitForAnimationToEnd
            - tapOn:
                id: login-submit-button
            - waitForAnimationToEnd
            - runFlow:
                when:
                  visible:
                    id: login-email-input
                commands:
                  - takeScreenshot: 01-auth-session-login-still-visible-after-retry
                  - assertNotVisible:
                      id: login-email-input
            - extendedWaitUntil:
                visible:
                  id: tab-home
                timeout: 30000

- runFlow:
    when:
      notVisible:
        id: login-email-input
    commands:
      - takeScreenshot: 01-auth-session-unknown-state
      - assertVisible:
          id: tab-home

- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 20000

- assertVisible:
    id: tab-home
