appId: com.fesperiquette.keepeat
---
- launchApp
- waitForAnimationToEnd
- takeScreenshot: 01-auth-session-initial-state

# Branch 1: User already authenticated (tab-home visible)
- runFlow:
    when:
      visible:
        id: tab-home
    commands:
      - takeScreenshot: 01-auth-session-already-authenticated
      - assertVisible:
          id: tab-home

# Branch 2: Login screen visible - perform login
- runFlow:
    when:
      visible:
        id: login-email-input
    commands:
      - takeScreenshot: 01-auth-session-login-screen-visible
      - tapOn:
          id: login-email-input
      - inputText: e2e.free@keepeat.test
      - tapOn:
          id: login-password-input
      - inputText: TestPassword123!
      - hideKeyboard
      - waitForAnimationToEnd
      - tapOn:
          id: login-submit-button
      - waitForAnimationToEnd
      - takeScreenshot: 01-auth-session-after-submit
      - extendedWaitUntil:
          visible:
            id: tab-home
          timeout: 60000
      - assertVisible:
          id: tab-home

# Check: Login still visible after submit (means login failed)
- runFlow:
    when:
      visible:
        id: login-email-input
    commands:
      - takeScreenshot: 01-auth-session-login-still-visible-after-submit
      - waitForAnimationToEnd
      - takeScreenshot: 01-auth-session-login-error-state
      - assertNotVisible:
          id: login-email-input

# Branch 3: Tab not visible (not authenticated) - retry login if screen becomes visible
- runFlow:
    when:
      notVisible:
        id: tab-home
    commands:
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              id: login-email-input
          commands:
            - takeScreenshot: 01-auth-session-retry-login-visible
            - tapOn:
                id: login-email-input
            - inputText: e2e.free@keepeat.test
            - tapOn:
                id: login-password-input
            - inputText: TestPassword123!
            - hideKeyboard
            - waitForAnimationToEnd
            - tapOn:
                id: login-submit-button
            - waitForAnimationToEnd
            - takeScreenshot: 01-auth-session-retry-after-submit
            - waitForAnimationToEnd
            - runFlow:
                when:
                  visible:
                    id: login-email-input
                commands:
                  - takeScreenshot: 01-auth-session-login-still-visible-after-retry
                  - assertNotVisible:
                      id: login-email-input
            - extendedWaitUntil:
                visible:
                  id: tab-home
                timeout: 60000

# Branch 4: Neither home nor login visible (unknown state - must fail with diagnostics)
- runFlow:
    when:
      notVisible:
        id: login-email-input
    commands:
      - takeScreenshot: 01-auth-session-before-final-assert
      - assertVisible:
          id: tab-home

# Final safety net: Wait for home with extended timeout (60s for slow CI emulator boot)
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 60000

# Final assertion: Home must be visible
- assertVisible:
    id: tab-home
