appId: com.fesperiquette.keepeat
# BUG-034 — Régression device : supprimer DEUX articles consécutivement par swipe.
# Reproduit le bug utilisateur (2026-06-10) : après la 1ère suppression par swipe,
# le 2ème swipe était bloqué. C'est le seul niveau qui exerce réellement le gesture
# handler RNGH + l'overlay banner (impossible à reproduire sous node:test).
---
- launchApp
- runFlow: helpers/ensure-authenticated.yaml
# --- Préparer un état déterministe : 2 produits nommés ---
- tapOn:
    id: tab-scan
- tapOn:
    id: scan-add-manual-button
- assertVisible:
    id: add-product-name-input
- tapOn:
    id: add-product-name-input
- inputText: Swipe Alpha
# BUG-107 : bouton en bas du formulaire, hors de l'écran clavier ouvert.
- hideKeyboard
- scrollUntilVisible:
    element:
      id: add-product-save-button
    direction: DOWN
- tapOn:
    id: add-product-save-button
- tapOn:
    id: tab-scan
- tapOn:
    id: scan-add-manual-button
- assertVisible:
    id: add-product-name-input
- tapOn:
    id: add-product-name-input
- inputText: Swipe Beta
# BUG-107 : bouton en bas du formulaire, hors de l'écran clavier ouvert.
- hideKeyboard
- scrollUntilVisible:
    element:
      id: add-product-save-button
    direction: DOWN
- tapOn:
    id: add-product-save-button
# --- Aller au stock : les deux articles sont visibles ---
- tapOn:
    id: tab-stock
# BUG-107 : les deux articles ajoutés viennent après ceux du jeu de test ;
# sur un petit écran, ils sont plus bas dans la liste.
- scrollUntilVisible:
    element:
      text: Swipe Alpha
    direction: DOWN
- assertVisible:
    text: Swipe Alpha
- scrollUntilVisible:
    element:
      text: Swipe Beta
    direction: DOWN
- assertVisible:
    text: Swipe Beta
# --- 1ère suppression par swipe ---
- swipe:
    from:
      text: Swipe Alpha
    direction: LEFT
- assertNotVisible:
    text: Swipe Alpha
# --- 2ème suppression par swipe : DOIT fonctionner (cœur de BUG-034) ---
- swipe:
    from:
      text: Swipe Beta
    direction: LEFT
- assertNotVisible:
    text: Swipe Beta
