appId: com.fesperiquette.keepeat
---
- launchApp
- runFlow: helpers/ensure-authenticated.yaml
- tapOn:
    id: tab-stock
- tapOn:
    id: stock-item-row
- assertVisible:
    id: stock-item-edit-button
- tapOn:
    id: stock-item-edit-button
- tapOn:
    id: edit-product-name-input
- eraseText
- inputText: Courgette éditée
# BUG-107 : le bouton Enregistrer est en pied d'écran, sous le clavier ouvert.
- hideKeyboard
- tapOn:
    id: edit-product-save-button
# BUG-107 : l'enregistrement se confirme par une alerte « Modifié ! », dont
# le bouton ramène à la fiche produit (bouton positif d'une alerte Android).
- tapOn:
    id: "android:id/button1"
- assertVisible:
    id: stock-item-edit-button
