# Typage Python : mode normal sur backend/ et tests/, exécuté en CI (BUG-079,
# BUG-086). Tous les modules applicatifs de backend/ sont en strict (BUG-088),
# sauf ceux listés plus bas, qui restent en mode normal en attendant leur tour.
# Un nouveau module de backend/ est strict par défaut.
[mypy]
python_version = 3.11
ignore_missing_imports = True
show_error_codes = True
warn_redundant_casts = True

# Équivalent par module de --strict (cette option n'existe qu'en global).
[mypy-backend.*]
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
warn_unused_ignores = True
warn_return_any = True
implicit_reexport = False
strict_equality = True
extra_checks = True

# Mode normal, en attendant leur tour : server.py (124 erreurs strictes le
# 14/11), les scripts d'exploitation ponctuels et les tests.
[mypy-backend.server,backend.scripts.*,backend.tests.*]
disallow_any_generics = False
disallow_subclassing_any = False
disallow_untyped_calls = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_untyped_decorators = False
warn_unused_ignores = False
warn_return_any = False
implicit_reexport = True
strict_equality = False
extra_checks = False
