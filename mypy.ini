# Typage Python (BUG-079) : mode normal sur backend/ et tests/, exécuté en CI.
# Le mode strict (1 600 erreurs mesurées le 12/11) viendra par paliers, module
# par module, via des sections [mypy-backend.xxx] plus exigeantes.
[mypy]
python_version = 3.11
ignore_missing_imports = True
show_error_codes = True
