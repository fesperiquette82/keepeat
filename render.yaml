services:
  - type: web
    name: keepeat-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: sh -c 'export PYTHONPATH=$PWD && python -m uvicorn asgi:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    autoDeploy: true
