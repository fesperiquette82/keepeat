services:
  - type: web
    name: keepeat-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    env:
      PYTHONPATH: /opt/render/project
    startCommand: python -m uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
